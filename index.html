<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Assistant 🧠</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .message-in { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans text-slate-900">
    <div class="max-w-4xl mx-auto p-4 h-screen flex flex-col">
        <!-- Header -->
        <header class="flex items-center justify-between mb-6 glass p-4 rounded-2xl shadow-sm">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">AI Knowledge Assistant</h1>
            </div>
            <div class="flex items-center gap-2">
                <label for="role-select" class="sr-only">Select Assistant Role</label>
                <select id="role-select" class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    <option value="assistant">Helpful Assistant 🤖</option>
                    <option value="teacher">Knowledgeable Teacher 🎓</option>
                    <option value="storyteller">Creative Storyteller 📖</option>
                    <option value="interviewer">Professional Interviewer 👔</option>
                </select>
                <button id="reset-btn" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-500" title="Clear History" aria-label="Clear conversation history">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Chat Container -->
        <main id="chat-container" class="flex-1 overflow-y-auto mb-6 p-4 space-y-4 scroll-smooth">
            <div class="bg-blue-50 text-blue-800 p-4 rounded-2xl max-w-[80%] shadow-sm">
                Hello! I'm your AI assistant. Select a role above or just start asking me anything! 👋
            </div>
        </main>

        <!-- Input Area -->
        <footer class="pb-4">
            <form id="chat-form" class="relative group">
                <label for="user-input" class="sr-only">Your message</label>
                <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" required
                    class="w-full bg-white border border-slate-200 rounded-2xl pl-6 pr-14 py-4 shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all text-slate-700">
                <button type="submit" aria-label="Send message" class="absolute right-3 top-2.5 bg-blue-600 hover:bg-blue-700 text-white p-2 px-3 rounded-xl shadow-md transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const roleSelect = document.getElementById('role-select');
        const resetBtn = document.getElementById('reset-btn');

        const roles = {
            assistant: "You are a helpful AI assistant.",
            teacher: "You are a knowledgeable teacher who explains clearly with examples.",
            storyteller: "You are a creative storyteller with engaging narration.",
            interviewer: "You are an interviewer asking professional questions."
        };

        function addMessage(content, role) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} message-in`;

            const inner = document.createElement('div');
            inner.className = role === 'user'
                ? "bg-blue-600 text-white p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow-md"
                : "bg-white text-slate-700 p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm border border-slate-100";

            inner.textContent = content;
            div.appendChild(inner);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = "flex justify-start message-in";
            div.innerHTML = `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-1">
                    <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
                    <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                    <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            addMessage(text, 'user');
            addTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: text,
                        role_prompt: roles[roleSelect.value]
                    })
                });

                const data = await response.json();
                document.getElementById('typing-indicator').remove();

                if (data.error) {
                    addMessage("Error: " + data.error, "system");
                } else {
                    addMessage(data.content, "ai");
                }
            } catch (err) {
                document.getElementById('typing-indicator').remove();
                addMessage("Failed to connect to server.", "system");
            }
        });

        resetBtn.addEventListener('click', async () => {
            if (!confirm("Clear conversation history?")) return;
            try {
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: 'web_user_1' })
                });
                chatContainer.innerHTML = '<div class="bg-blue-50 text-blue-800 p-4 rounded-2xl max-w-[80%] shadow-sm">History cleared. How can I help you now?</div>';
            } catch (err) {
                alert("Failed to reset history.");
            }
        });
    </script>
</body>
</html>
